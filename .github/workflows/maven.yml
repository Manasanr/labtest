
name: Java CI/CD with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # JOB 1: BUILD AND TEST USING MAVEN
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn clean package -DskipTests=false

      # Upload Maven generated JAR
      - name: Upload Maven Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

  # JOB 2: BUILD AND PUSH TO DOCKER HUB
  docker-publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    # Only push to Docker Hub on pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Download JAR from Maven job
      - name: Download Maven Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: manasanr10/shopping-cart:latest
